[project]
name = "kat-coderv25"
version = "0.1.0"
description = "Llama Server Configurator GUI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = []

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
warn_redundant_options = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
